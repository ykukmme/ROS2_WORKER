vision_service:
  ros__parameters:
    mock_mode: false
    mock_classes: [cup, can]
    detections_topic: /laptop_camera/detections
    enable_depth: false
    calibrated: false
    base_frame: base_link
    stop_file: /tmp/worker_sorting_bridge/auto-vision.stop
zone_service:
  ros__parameters:
    mock_mode: false
    image_topic: /laptop_camera/image_raw
    zone_colors: [red, blue]
    min_zone_area: 1500.0
    enable_depth: false
    calibrated: false
    base_frame: base_link
    stop_file: /tmp/worker_sorting_bridge/zones.stop
worker_service:
  ros__parameters:
    dry_run: true
    shared_grasp_verified: false
    task_timeout: 120.0
    source_roi: [0.0, 0.0, 640.0, 360.0]
    object_size: 0.06
    slot_margin: 0.01
    place_offset: 0.05
    auto_grasp_offset: 0.0
    empty_scans: 3
    scan_interval: 0.25
    dry_step_delay: 0.1
    stop_file: /tmp/worker_sorting_bridge/auto-worker.stop
