vision_service:
  ros__parameters:
    mock_mode: false
    detections_topic: /laptop_camera/detections
    enable_depth: false
    calibrated: false
    base_frame: base_link
    depth_topic: /camera/aligned_depth_to_color/image_raw
    camera_info_topic: /camera/color/camera_info
    max_age: 1.0
    sync_slop: 0.06
    scale_16u: 0.001
    min_depth: 0.1
    max_depth: 2.0
    stop_file: /tmp/worker_sorting_bridge/vision.stop
worker_service:
  ros__parameters:
    dry_run: true
    hardware_configured: false
    supported_classes: [box, bottle]
    base_frame: base_link
    target_max_age: 1.0
    min_confidence: 0.8
    service_timeout: 3.0
    task_timeout: 120.0
    dry_step_delay: 0.15
    history_capacity: 100
    workspace: [0.1, 0.7, -0.4, 0.4, 0.05, 0.7]
    home_position: [0.3, 0.0, 0.4]
    clearance: 0.1
    tool_quaternion: [1.0, 0.0, 0.0, 0.0]
    objects.box.bin_position: [0.35, -0.2, 0.2]
    objects.box.grasp_offset: 0.0
    objects.box.gripper_open: 0.04
    objects.box.gripper_closed: 0.0
    objects.bottle.bin_position: [0.35, 0.2, 0.2]
    objects.bottle.grasp_offset: 0.0
    objects.bottle.gripper_open: 0.04
    objects.bottle.gripper_closed: 0.0
    stop_file: /tmp/worker_sorting_bridge/worker.stop
